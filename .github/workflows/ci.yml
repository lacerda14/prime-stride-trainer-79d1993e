name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela runs antigos do mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # tsc --noEmit && eslint && vitest run
      - name: Check (typecheck + lint + test)
        run: npm run check

      - name: Build
        run: npm run build
